# Example Codex MCP configuration snippet.
#
# Add this block to the Codex config that manages local MCP servers, then
# restart the Codex session so the new server appears in the available tools.

[mcp_servers.cst2026]
command = "D:\\CSTapi\\run-cst2026-mcp.cmd"
args = []

# Optional but recommended when moving this MCP config between machines.
# Update these values to match the local CST installation path.
[mcp_servers.cst2026.env]
CST_INSTALL_DIR = "D:\\CST"
CST_PYTHON_EXE = "D:\\CST\\Python\\python.exe"
CST_MACRO_ROOT = "D:\\CST\\Library\\Macros"
CST_DESIGN_ENV_EXE = "D:\\CST\\CST DESIGN ENVIRONMENT.exe"
