# Merge into your local Codex configuration; preserve existing settings.
# Launch the MCP from the repository root. No machine paths are committed.
[mcp_servers.cst2026]
command = "node"
args = ["mcp/src/server.js"]
env_vars = ["CST_INSTALL_DIR", "CST_PYTHON_EXE", "CST_MACRO_ROOT", "CST_DESIGN_ENV_EXE"]
tool_timeout_sec = 7300

[mcp_servers.cst2026.env]
CST_KNOWLEDGE_ENABLED = "1"
CST_KNOWLEDGE_AUTO_CAPTURE = "1"
CST_KNOWLEDGE_DIR = "design-records/knowledge"
CST_KNOWLEDGE_STABLE_RUNS = "2"
